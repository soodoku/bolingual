[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bolingual"
version = "0.1.0"
description = "Reproducible Hindi-English sound-matching benchmark and retrieval baselines"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Gaurav Sood" },
]
keywords = [
    "hindi",
    "english",
    "phonetic-matching",
    "transliteration",
    "benchmark",
    "nlp",
    "cross-lingual",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "cmudict>=1.1.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pandas-stubs",
]
docs = [
    "sphinx>=7.0",
    "furo",
    "myst-parser",
    "sphinx-copybutton",
]
app = [
    "streamlit>=1.30",
]

[project.urls]
Homepage = "https://github.com/soodoku/bolingual"
Documentation = "https://soodoku.github.io/bolingual"
Repository = "https://github.com/soodoku/bolingual"
Issues = "https://github.com/soodoku/bolingual/issues"

[project.scripts]
bolingual-build-benchmark = "bolingual.cli:build_benchmark_cli"
bolingual-run-experiment = "bolingual.cli:run_experiment_cli"
bolingual-query = "bolingual.cli:query_cli"
bolingual-app = "bolingual.app:main"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/data",
    "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bolingual"]
artifacts = ["src/bolingual/data/*.csv"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["bolingual"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "cmudict",
    "rapidfuzz.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
